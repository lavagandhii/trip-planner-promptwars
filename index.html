<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderMind | Boutique Travel Intelligence</title>
    <!-- Premium Fonts via Fontshare -->
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<!-- Left: Sticky Form Sidebar -->
<aside class="input-panel" aria-label="Trip Configuration Form">
    <span class="eyebrow">WanderMind AI</span>
    <h1>Bespoke Journeys.</h1>
    <p style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 1.1rem;">Expert itineraries grounded in authentic market data.</p>
    
    <div id="error-box" aria-live="assertive" role="alert"></div>

    <form id="tripForm" aria-label="Itinerary Generation Form">
        <div class="form-group" style="position: relative;">
            <input type="text" id="destination" required placeholder="Select or type destination" value="Kyoto, Japan" autocomplete="off" aria-label="Destination City or Country" aria-required="true">
            <label for="destination">Destination</label>
            <div id="autocomplete-list" class="autocomplete-items" role="listbox" aria-label="Destination Suggestions"></div>
        </div>
        <div class="form-group">
            <input type="number" id="days" required min="1" max="14" value="3" placeholder="Number of days" aria-label="Duration in Days" aria-required="true">
            <label for="days">Duration (Days)</label>
        </div>
        <div class="form-group">
            <input type="number" id="budget" required min="1000" step="500" value="40000" placeholder="Budget in INR" aria-label="Per Person Budget in Rupees" aria-required="true">
            <label for="budget">Per Person Budget (₹ INR)</label>
        </div>
        <div class="form-group">
            <label for="travelerType" style="margin-bottom:0.5rem; padding-top: 0.5rem;">Travel Unit</label>
            <select id="travelerType" aria-label="Select Traveler Type">
                <option value="Solo">Solo Explorer</option>
                <option value="Couple" selected>Couple</option>
                <option value="Family">Family (with Kids)</option>
                <option value="Friends">Group of Friends</option>
            </select>
        </div>
        <div class="form-group">
            <textarea id="preferences" placeholder="Specify pace, vibe, or special interests" aria-label="Curatorial Directives and Travel Preferences"></textarea>
            <label for="preferences">Curatorial Directives (Pace, Vibe, Focus)</label>
        </div>
        <button type="submit" class="primary-btn" id="generateBtn" aria-label="Craft Itinerary">
            <span>Craft Itinerary</span>
        </button>
    </form>

    <div class="loader-wrapper" id="loader" aria-live="polite">
        <div class="spinner-line"></div>
        <div class="loader-text" id="loader-text">Consulting local intelligence...</div>
    </div>
</aside>

<!-- Right: Main Content Canvas -->
<main class="output-panel" aria-label="Generated Travel Intelligence">
    <div id="results">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <span class="eyebrow" style="margin-bottom: 0;">Bespoke Intelligence Briefing</span>
            <button class="breathe-btn" id="exportBtn" onclick="exportItinerary()" aria-label="Export Itinerary as Markdown">📤 Export Intel (Copy Markdown)</button>
        </div>
        <div class="budget-section">
            <h2>Financial Blueprint</h2>
            <p id="budget-reasoning" style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1rem; border-left: 2px solid var(--accent); padding-left: 1rem;"></p>
            <div class="budget-grid" id="budget-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <div class="timeline-section">
            <h2>The Itinerary</h2>
            <div class="timeline-line"></div>
            <div id="itinerary-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <div class="info-grid">
            <div>
                <h2>Insider Briefing</h2>
                <ul class="premium-list" id="tips-container"></ul>
            </div>
            <div>
                <h2>Logistics & Gear</h2>
                <ul class="premium-list" id="packing-container"></ul>
            </div>
        </div>

    </div>
</main>

<script src="app.js?v=4"></script>
</body>
</html>
