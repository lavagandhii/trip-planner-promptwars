<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderMind | AI Trip Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; color: transparent; }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .api-banner {
            background: var(--bg-card); padding: 1rem; border-radius: 8px; border: 1px solid var(--border);
            margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; justify-content: center;
        }
        .api-banner input { flex: 1; max-width: 400px; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: white; }

        .glass-panel {
            background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
        input, select, textarea {
            padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.2);
            color: white; font-family: 'Inter', sans-serif; font-size: 1rem;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }

        button.primary-btn {
            background: var(--primary); color: white; border: none; padding: 1rem 2rem; font-size: 1.1rem;
            font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        button.primary-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.primary-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Loader */
        .loader { display: none; text-align: center; margin: 2rem 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Results Area */
        #results { display: none; }
        
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h3 { font-size: 1.3rem; margin-bottom: 1rem; color: #a78bfa; }

        /* Day Card */
        .day-card {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; margin-bottom: 1.5rem; position: relative;
        }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .pace-warning { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .breathing-room-btn { background: var(--danger); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
        .breathing-room-btn:hover { background: #b91c1c; }

        /* Activity List */
        .activity-item {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 1rem;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { font-weight: 600; color: var(--text-muted); min-width: 80px; }
        .activity-details { flex: 1; }
        .activity-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.25rem; }
        .activity-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 1rem; }
        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge.local { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .badge.premium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

        /* Budget Grid */
        .budget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .budget-card { background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .budget-card.total { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(167, 139, 250, 0.2)); border-color: rgba(167, 139, 250, 0.5); }
        .budget-val { font-size: 1.8rem; font-weight: 700; margin: 0.5rem 0; }
        .split-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); display: flex; overflow: hidden; margin-top: 1rem; }
        .split-local { background: var(--accent-green); height: 100%; }
        .split-premium { background: var(--accent-orange); height: 100%; }
        .split-labels { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 0.5rem; color: var(--text-muted); }

        /* Lists */
        ul.styled-list { list-style: none; }
        ul.styled-list li { position: relative; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        ul.styled-list li::before { content: "•"; color: var(--primary); position: absolute; left: 0; font-weight: bold; font-size: 1.2rem; }

        /* Error */
        #error-box { display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); padding: 1rem; border-radius: 8px; color: #fca5a5; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WanderMind AI</h1>
        <p class="subtitle">Your 30-Year Expert Travel Agent</p>
    </header>



    <div class="glass-panel" id="input-section">
        <h2>Plan Your Trip</h2>
        <div id="error-box" role="alert"></div>
        <form id="tripForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" required placeholder="e.g., Kyoto, Japan">
                </div>
                <div class="form-group">
                    <label for="days">Number of Days</label>
                    <input type="number" id="days" required min="1" max="14" value="3">
                </div>
                <div class="form-group">
                    <label for="budget">Total Budget (₹ INR)</label>
                    <input type="number" id="budget" required min="1000" step="500" value="30000">
                </div>
                <div class="form-group">
                    <label for="travelerType">Traveler Type</label>
                    <select id="travelerType">
                        <option value="Solo">Solo</option>
                        <option value="Couple">Couple</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Group of Friends</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="preferences">What matters most to you?</label>
                <textarea id="preferences" placeholder="e.g., Relaxed pace, authentic local street food, minimal walking, off-the-beaten-path..."></textarea>
            </div>
            <button type="submit" class="primary-btn" id="generateBtn">Generate Expert Itinerary</button>
        </form>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Consulting local contacts and calculating authentic prices...</p>
    </div>

    <div id="results">
        <!-- Budget Breakdown -->
        <div class="glass-panel">
            <h2>Budget Breakdown (₹ INR)</h2>
            <div class="budget-grid" id="budget-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <!-- Itinerary -->
        <div class="glass-panel">
            <h2>Day-by-Day Itinerary</h2>
            <div id="itinerary-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <!-- Insider Tips & Packing -->
        <div class="form-grid">
            <div class="glass-panel">
                <h2>Insider Tips</h2>
                <ul class="styled-list" id="tips-container"></ul>
            </div>
            <div class="glass-panel">
                <h2>Smart Packing List</h2>
                <ul class="styled-list" id="packing-container"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    // System Schema for Gemini 2.0 Flash
    const responseSchema = {
        type: "object",
        properties: {
            itinerary: {
                type: "array",
                items: {
                    type: "object",
                    properties: {
                        day: { type: "number" },
                        theme: { type: "string" },
                        overPackedFlag: { type: "boolean" },
                        activities: {
                            type: "array",
                            items: {
                                type: "object",
                                properties: {
                                    id: { type: "string" },
                                    timeOfDay: { type: "string" },
                                    title: { type: "string" },
                                    durationHours: { type: "number" },
                                    costINR: { type: "number" },
                                    costCategory: { type: "string", enum: ["Local", "Premium/Tourist"] },
                                    priority: { type: "string", enum: ["High", "Medium", "Low"] }
                                },
                                required: ["id", "timeOfDay", "title", "durationHours", "costINR", "costCategory", "priority"]
                            }
                        }
                    },
                    required: ["day", "theme", "overPackedFlag", "activities"]
                }
            },
            insiderTips: { type: "array", items: { type: "string" } },
            packingList: { type: "array", items: { type: "string" } },
            budgetSummary: {
                type: "object",
                properties: {
                    stayTotalINR: { type: "number" },
                    foodLocalINR: { type: "number" },
                    foodPremiumINR: { type: "number" },
                    transportLocalINR: { type: "number" },
                    transportPremiumINR: { type: "number" },
                    activitiesLocalINR: { type: "number" },
                    activitiesPremiumINR: { type: "number" }
                },
                required: ["stayTotalINR", "foodLocalINR", "foodPremiumINR", "transportLocalINR", "transportPremiumINR", "activitiesLocalINR", "activitiesPremiumINR"]
            }
        },
        required: ["itinerary", "insiderTips", "packingList", "budgetSummary"]
    };

    // Global state to allow client-side mutations (Pace Check)
    let currentPlan = null;

    document.getElementById('tripForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const apiKey = "AIzaSyBJjA6BipEq1afXSrxyy5QueB7WXpuVCkw";
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = 'none';
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        // Gather Inputs
        const dest = document.getElementById('destination').value;
        const days = document.getElementById('days').value;
        const budget = document.getElementById('budget').value;
        const type = document.getElementById('travelerType').value;
        const prefs = document.getElementById('preferences').value;

        // Grounding Prompts (Anchor injection)
        const promptText = `
        Act as an elite travel agent with 30 years of experience.
        Plan a trip to: ${dest}
        Duration: ${days} days
        Traveler: ${type}
        Total Budget: ₹${budget} INR
        Preferences: ${prefs || 'None'}

        CRITICAL GROUNDING RULES FOR PRICES:
        - Reason relative to these estimated base anchors per person: 
          * Avg Budget Hotel: ₹2,000/night
          * Authentic Local Meal: ₹300
          * Premium/Tourist Meal: ₹1,500
          * Local Transport (Bus/Metro): ₹100
          * Tourist Transport (Taxi): ₹600
        - Scale costs based on the 'Traveler Type' (e.g. Family = 3-4x cost for food/transport).
        - Ensure the total itemized budget does NOT exceed ₹${budget}. If budget is too low, state compromises in insiderTips.
        
        PACE CHECK RULE:
        - If the total durationHours of activities in a day exceeds 8 hours, set overPackedFlag to true.
        - Always provide at least one 'Low' priority activity per day that can be safely skipped.

        Return ONLY a JSON matching the provided schema. No markdown wrapping. Give unique string IDs to each activity (e.g., 'd1-a1').
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: responseSchema
                    }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || "API request failed");
            }

            const data = await response.json();
            const jsonString = data.candidates[0].content.parts[0].text;
            
            // Safe Parsing
            currentPlan = JSON.parse(jsonString);
            renderPlan();

            document.getElementById('results').style.display = 'block';
        } catch (err) {
            showError(`Error generating plan: ${err.message}. Please check your API key and try again.`);
        } finally {
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('loader').style.display = 'none';
        }
    });

    function showError(msg) {
        const errorBox = document.getElementById('error-box');
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        window.scrollTo(0, 0);
    }

    // Escape HTML to prevent XSS
    function esc(str) {
        if (typeof str !== 'string') return str;
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }

    function renderPlan() {
        if (!currentPlan) return;
        renderBudget();
        renderItinerary();
        
        // Render Tips & Packing
        document.getElementById('tips-container').innerHTML = currentPlan.insiderTips.map(t => `<li>${esc(t)}</li>`).join('');
        document.getElementById('packing-container').innerHTML = currentPlan.packingList.map(t => `<li>${esc(t)}</li>`).join('');
    }

    function renderBudget() {
        const b = currentPlan.budgetSummary;
        
        // Calculate dynamically from the itinerary to allow client-side Pace Check updates
        let actLocal = 0, actPrem = 0;
        currentPlan.itinerary.forEach(day => {
            day.activities.forEach(a => {
                if (a.costCategory === 'Local') actLocal += a.costINR;
                else actPrem += a.costINR;
            });
        });
        
        b.activitiesLocalINR = actLocal;
        b.activitiesPremiumINR = actPrem;

        const totalFood = b.foodLocalINR + b.foodPremiumINR;
        const totalTrans = b.transportLocalINR + b.transportPremiumINR;
        const totalAct = b.activitiesLocalINR + b.activitiesPremiumINR;
        const grandTotal = b.stayTotalINR + totalFood + totalTrans + totalAct;

        const budgetContainer = document.getElementById('budget-container');
        budgetContainer.innerHTML = `
            <div class="budget-card total">
                <h3>Total Trip Cost</h3>
                <div class="budget-val">₹${grandTotal.toLocaleString()}</div>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Accommodation: ₹${b.stayTotalINR.toLocaleString()}</p>
            </div>
            ${renderBudgetSplitCard("Food & Dining", b.foodLocalINR, b.foodPremiumINR)}
            ${renderBudgetSplitCard("Transport", b.transportLocalINR, b.transportPremiumINR)}
            ${renderBudgetSplitCard("Activities", b.activitiesLocalINR, b.activitiesPremiumINR)}
        `;
    }

    function renderBudgetSplitCard(title, local, premium) {
        const total = local + premium;
        const localPct = total > 0 ? (local / total) * 100 : 50;
        const premPct = total > 0 ? (premium / total) * 100 : 50;
        
        return `
            <div class="budget-card">
                <h3>${title}</h3>
                <div class="budget-val">₹${total.toLocaleString()}</div>
                <div class="split-bar">
                    <div class="split-local" style="width: ${localPct}%" title="Local/Authentic: ₹${local}"></div>
                    <div class="split-premium" style="width: ${premPct}%" title="Premium/Tourist: ₹${premium}"></div>
                </div>
                <div class="split-labels">
                    <span style="color: #6ee7b7">Local: ₹${local.toLocaleString()}</span>
                    <span style="color: #fcd34d">Tourist: ₹${premium.toLocaleString()}</span>
                </div>
            </div>
        `;
    }

    function renderItinerary() {
        const container = document.getElementById('itinerary-container');
        container.innerHTML = currentPlan.itinerary.map((day, dayIndex) => {
            
            const totalHours = day.activities.reduce((sum, a) => sum + a.durationHours, 0);
            // Re-evaluate overPackedFlag dynamically based on current activities
            const isOverPacked = totalHours > 8;

            let warningHtml = '';
            if (isOverPacked) {
                // Find lowest priority activity to offer skipping
                const lowPri = day.activities.find(a => a.priority === 'Low');
                warningHtml = `
                    <div class="pace-warning">
                        ⚠️ Pace Check: Day is over-packed (${totalHours} hours of activities). 
                        ${lowPri ? `<button class="breathing-room-btn" onclick="skipActivity(${dayIndex}, '${lowPri.id}')">Skip '${esc(lowPri.title)}' for Breathing Room</button>` : ''}
                    </div>
                `;
            }

            const activitiesHtml = day.activities.map(act => `
                <div class="activity-item" id="${act.id}">
                    <div class="activity-time">${esc(act.timeOfDay)}</div>
                    <div class="activity-details">
                        <div class="activity-title">${esc(act.title)}</div>
                        <div class="activity-meta">
                            <span>⏱️ ${act.durationHours} hr</span>
                            <span>₹${act.costINR.toLocaleString()}</span>
                            <span class="badge ${act.costCategory === 'Local' ? 'local' : 'premium'}">${esc(act.costCategory)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="day-card">
                    <div class="day-header">
                        <h3>Day ${day.day}: ${esc(day.theme)}</h3>
                    </div>
                    ${warningHtml}
                    <div style="margin-top: 1rem;">
                        ${activitiesHtml}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Client-side instant recalculation
    window.skipActivity = function(dayIndex, activityId) {
        const day = currentPlan.itinerary[dayIndex];
        // Remove the activity
        day.activities = day.activities.filter(a => a.id !== activityId);
        
        // Re-render everything instantly (updates Pace Check & Budget)
        renderPlan();
    };
</script>
</body>
</html>
