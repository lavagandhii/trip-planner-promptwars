<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderMind | Boutique Travel Intelligence</title>
    <!-- Premium Fonts via Fontshare -->
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Boutique Travel Palette */
            --bg-base: #0A1411;       /* Deep Forest/Midnight Green */
            --bg-surface: #101E1A;    /* Slightly lighter green for cards */
            --accent: #D97757;        /* Warm Terracotta */
            --accent-hover: #E38D71;
            --text-primary: #FDFBF7;  /* Cream/Off-white */
            --text-secondary: #9DB4AB; /* Muted Sage Green */
            --local-green: #679267;
            --tourist-orange: #D97757;
            
            --font-head: 'Cabinet Grotesk', sans-serif;
            --font-body: 'Satoshi', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Asymmetrical Split Layout */
        .input-panel {
            width: 35%;
            min-width: 400px;
            padding: 2.5rem 3rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            background: linear-gradient(180deg, rgba(16,30,26,0.8) 0%, rgba(10,20,17,1) 100%);
            border-right: 1px solid rgba(253, 251, 247, 0.05);
            z-index: 10;
        }

        .output-panel {
            flex: 1;
            padding: 3rem;
            background-image: radial-gradient(circle at 100% 0%, rgba(217, 119, 87, 0.03) 0%, transparent 40%);
            min-height: 100vh;
        }

        @media (max-width: 1100px) {
            body { flex-direction: column; }
            .input-panel { width: 100%; position: relative; height: auto; min-width: auto; border-right: none; padding: 2rem; }
            .output-panel { width: 100%; padding: 2rem; }
        }

        /* Typography */
        h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; letter-spacing: -0.02em; }
        h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 0.5rem; color: var(--text-primary); }
        h2 { font-size: 2.2rem; margin-bottom: 2rem; color: var(--text-primary); }
        h3 { font-size: 1.4rem; color: var(--accent); margin-bottom: 0.5rem; }
        .eyebrow { font-family: var(--font-body); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-secondary); margin-bottom: 1rem; display: block; font-weight: 700;}

        /* Premium Forms (Bottom border only) */
        .form-group { margin-bottom: 2rem; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 0.5rem; transition: color 0.3s; }
        input, select, textarea {
            width: 100%; padding: 0.5rem 0; background: transparent; border: none; border-bottom: 1px solid rgba(253, 251, 247, 0.2);
            color: var(--text-primary); font-family: var(--font-head); font-size: 1.2rem; transition: all 0.3s ease;
        }
        textarea { font-family: var(--font-body); font-size: 1rem; resize: vertical; min-height: 80px; margin-top: 0.5rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--accent); }
        input:focus + label, select:focus + label, textarea:focus + label { color: var(--accent); }
        
        /* Dropdown styling for dark mode */
        select option { background-color: var(--bg-surface); color: var(--text-primary); }

        button.primary-btn {
            width: 100%; background: var(--accent); color: var(--bg-base); border: none;
            padding: 1.2rem; font-family: var(--font-head); font-size: 1.2rem; font-weight: 700;
            cursor: pointer; border-radius: 4px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
        }
        button.primary-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(217, 119, 87, 0.2); }
        button.primary-btn:disabled { background: var(--bg-surface); color: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }

        /* Loader */
        .loader-wrapper { display: none; margin-top: 2rem; text-align: left; animation: fadeIn 0.5s; }
        .spinner-line { height: 2px; width: 100%; background: rgba(253, 251, 247, 0.1); position: relative; overflow: hidden; margin-bottom: 1rem; border-radius: 2px; }
        .spinner-line::after { content: ''; position: absolute; left: -50%; width: 50%; height: 100%; background: var(--accent); animation: loadingLine 1.5s infinite ease-in-out; }
        .loader-text { font-family: var(--font-head); font-size: 1.1rem; color: var(--accent); animation: pulseText 1.5s infinite; }
        
        @keyframes loadingLine { 0% { left: -50%; } 100% { left: 100%; } }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #results { display: none; animation: fadeIn 0.8s ease-out; }

        /* Visual Budget Breakdown */
        .budget-section { margin-bottom: 5rem; }
        .budget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
        .budget-card {
            background: rgba(255, 255, 255, 0.02); padding: 2rem; border-radius: 12px;
            border: 1px solid rgba(253, 251, 247, 0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
        }
        .budget-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.03); }
        .budget-title { font-family: var(--font-head); font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .budget-value { font-family: var(--font-head); font-size: 2.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1.5rem; }
        
        /* Bar Chart */
        .bar-chart-container { width: 100%; }
        .chart-bar { height: 8px; border-radius: 4px; display: flex; overflow: hidden; background: rgba(253, 251, 247, 0.05); margin-bottom: 0.8rem; }
        .chart-segment-local { background: var(--local-green); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .chart-segment-tourist { background: var(--tourist-orange); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .chart-legend { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 500; }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* Vertical Timeline Itinerary */
        .timeline-section { position: relative; margin-bottom: 5rem; }
        .timeline-line { position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: rgba(253, 251, 247, 0.05); }
        
        .day-group { position: relative; margin-bottom: 4rem; padding-left: 3rem; }
        .day-indicator { position: absolute; left: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg-base); z-index: 2; }
        
        .warning-badge { 
            display: inline-flex; align-items: center; gap: 1rem; background: rgba(217, 119, 87, 0.1); 
            border: 1px solid rgba(217, 119, 87, 0.3); color: var(--accent); padding: 0.75rem 1.2rem; 
            border-radius: 6px; font-weight: 500; margin: 1rem 0 2rem 0; font-size: 0.9rem;
        }
        .breathe-btn { 
            background: transparent; color: var(--accent); border: 1px solid var(--accent); 
            padding: 0.4rem 0.8rem; border-radius: 4px; font-family: var(--font-body); font-weight: 600; 
            cursor: pointer; transition: all 0.2s; 
        }
        .breathe-btn:hover { background: var(--accent); color: var(--bg-base); }

        .activity-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(253, 251, 247, 0.05); 
            border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; cursor: pointer;
        }
        .activity-card:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.03); border-color: rgba(217, 119, 87, 0.3); }
        .activity-card.collapsing { height: 0 !important; padding: 0 !important; margin: 0 !important; opacity: 0; border: none; }
        
        .act-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .act-time { font-family: var(--font-head); color: var(--text-secondary); font-size: 1.1rem; }
        .act-title { font-family: var(--font-head); font-size: 1.4rem; color: var(--text-primary); }
        .act-cost { font-family: var(--font-head); font-size: 1.2rem; color: var(--accent); }
        
        .act-meta { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-secondary); align-items: center; }
        .pill { padding: 0.25rem 0.75rem; border-radius: 20px; border: 1px solid rgba(253, 251, 247, 0.1); }
        .pill.transit { border-style: dashed; }

        /* Lists */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 4rem; }
        @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } }
        ul.premium-list { list-style: none; }
        ul.premium-list li { position: relative; padding-left: 2rem; margin-bottom: 1.5rem; line-height: 1.6; color: var(--text-secondary); }
        ul.premium-list li::before { content: '✦'; position: absolute; left: 0; color: var(--accent); font-family: var(--font-head); }
        ul.premium-list li strong { color: var(--text-primary); }

        /* Error */
        #error-box { 
            display: none; background: rgba(217, 119, 87, 0.1); border-left: 4px solid var(--accent); 
            color: var(--accent); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem; 
            font-family: var(--font-body); font-weight: 500; animation: fadeIn 0.3s;
        }

        /* Autocomplete */
        .autocomplete-items {
            position: absolute; border: 1px solid rgba(253, 251, 247, 0.1); 
            background-color: var(--bg-surface); z-index: 99; top: 100%; left: 0; right: 0;
            border-radius: 4px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-height: 200px; overflow-y: auto; display: none;
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(253, 251, 247, 0.05);
        }
        .autocomplete-items div:hover { background-color: var(--accent); color: var(--bg-base); }

        /* Wikipedia Expander */
        .wiki-drawer {
            max-height: 0; overflow: hidden; transition: all 0.4s ease-out;
            background: rgba(0,0,0,0.2); border-radius: 8px; margin-top: 0;
            display: flex; gap: 1rem; align-items: flex-start; opacity: 0;
        }
        .wiki-drawer.open { max-height: 400px; padding: 1.2rem; margin-top: 1.5rem; border: 1px solid rgba(253,251,247,0.05); opacity: 1; }
        .wiki-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--bg-base); }
        .wiki-text { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5; }
        .wiki-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; margin-top: 0.5rem; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em;}
    </style>
</head>
<body>

<!-- Left: Sticky Form -->
<div class="input-panel">
    <span class="eyebrow">WanderMind AI</span>
    <h1>Bespoke Journeys.</h1>
    <p style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 1.1rem;">Expert itineraries grounded in authentic market data.</p>
    
    <div id="error-box"></div>

    <form id="tripForm">
        <div class="form-group" style="position: relative;">
            <input type="text" id="destination" required placeholder=" " value="Kyoto, Japan" autocomplete="off">
            <label for="destination">Destination</label>
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <div class="form-group">
            <input type="number" id="days" required min="1" max="14" value="3" placeholder=" ">
            <label for="days">Duration (Days)</label>
        </div>
        <div class="form-group">
            <input type="number" id="budget" required min="1000" step="500" value="40000" placeholder=" ">
            <label for="budget">Total Cap (₹ INR)</label>
        </div>
        <div class="form-group">
            <label for="travelerType" style="margin-bottom:0.5rem; padding-top: 0.5rem;">Travel Unit</label>
            <select id="travelerType">
                <option value="Solo">Solo Explorer</option>
                <option value="Couple" selected>Couple</option>
                <option value="Family">Family</option>
                <option value="Friends">Group</option>
            </select>
        </div>
        <div class="form-group">
            <textarea id="preferences" placeholder=" "></textarea>
            <label for="preferences">Curatorial Directives (Pace, Vibe, Focus)</label>
        </div>
        <button type="submit" class="primary-btn" id="generateBtn">
            <span>Craft Itinerary</span>
        </button>
    </form>

    <div class="loader-wrapper" id="loader">
        <div class="spinner-line"></div>
        <div class="loader-text" id="loader-text">Consulting local intelligence...</div>
    </div>
</div>

<!-- Right: Scrollable Canvas -->
<div class="output-panel">
    <div id="results">
        
        <div class="budget-section">
            <h2>Financial Blueprint</h2>
            <div class="budget-grid" id="budget-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <div class="timeline-section">
            <h2>The Itinerary</h2>
            <div class="timeline-line"></div>
            <div id="itinerary-container">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <div class="info-grid">
            <div>
                <h2>Insider Briefing</h2>
                <ul class="premium-list" id="tips-container"></ul>
            </div>
            <div>
                <h2>Logistics & Gear</h2>
                <ul class="premium-list" id="packing-container"></ul>
            </div>
        </div>

    </div>
</div>

<script>
    const popularDestinations = [
        "Kyoto, Japan", "Tokyo, Japan", "Paris, France", "Rome, Italy", 
        "New York City, USA", "Bali, Indonesia", "Reykjavik, Iceland", 
        "Cape Town, South Africa", "Machu Picchu, Peru", "Queenstown, New Zealand"
    ];

    const destInput = document.getElementById('destination');
    const autoList = document.getElementById('autocomplete-list');

    destInput.addEventListener('input', function() {
        const val = this.value;
        autoList.innerHTML = '';
        if (!val) { autoList.style.display = 'none'; return; }
        
        let hasMatches = false;
        popularDestinations.forEach(dest => {
            if (dest.toLowerCase().includes(val.toLowerCase())) {
                hasMatches = true;
                const div = document.createElement('div');
                div.innerHTML = dest.replace(new RegExp(val, "gi"), match => `<strong>${match}</strong>`);
                div.addEventListener('click', function() {
                    destInput.value = dest;
                    autoList.style.display = 'none';
                });
                autoList.appendChild(div);
            }
        });
        autoList.style.display = hasMatches ? 'block' : 'none';
    });

    document.addEventListener('click', function(e) {
        if (e.target !== destInput && e.target !== autoList) {
            autoList.style.display = 'none';
        }
    });

    let currentPlan = null;

    document.getElementById('tripForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('error-box');
        
        errorBox.style.display = 'none';
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        const loaderTexts = ["Consulting local intelligence...", "Anchoring market rates...", "Optimizing transit routing...", "Finalizing bespoke plan..."];
        let loaderIdx = 0;
        const loaderInterval = setInterval(() => {
            loaderIdx = (loaderIdx + 1) % loaderTexts.length;
            document.getElementById('loader-text').innerText = loaderTexts[loaderIdx];
        }, 1500);

        const payload = {
            destination: document.getElementById('destination').value,
            days: document.getElementById('days').value,
            budget: document.getElementById('budget').value,
            travelerType: document.getElementById('travelerType').value,
            preferences: document.getElementById('preferences').value
        };

        try {
            // Netlify Serverless Backend Call
            const response = await fetch('/.netlify/functions/plan-trip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || "Server connection failed");
            }

            const data = await response.json();
            
            if (data.isValidDestination === false) {
                throw new Error(data.destinationErrorMsg || "Unrecognized destination. Please enter a valid location.");
            }

            currentPlan = data;
            renderPlan();
            
            clearInterval(loaderInterval);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (err) {
            clearInterval(loaderInterval);
            showError(`Notice: ${err.message}`);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('generateBtn').disabled = false;
        }
    });

    function showError(msg) {
        const errorBox = document.getElementById('error-box');
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }

    function esc(str) {
        if (typeof str !== 'string') return str;
        return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
    }

    function renderPlan() {
        if (!currentPlan) return;
        renderBudget();
        renderItinerary();
        document.getElementById('tips-container').innerHTML = currentPlan.insiderTips.map(t => `<li>${esc(t)}</li>`).join('');
        document.getElementById('packing-container').innerHTML = currentPlan.packingList.map(t => `<li>${esc(t)}</li>`).join('');
        document.getElementById('generateBtn').disabled = false;
    }

    function renderBudget() {
        const b = currentPlan.budgetSummary;
        
        let actLocal = 0, actPrem = 0;
        currentPlan.itinerary.forEach(day => {
            day.activities.forEach(a => {
                if (a.costCategory === 'Local') actLocal += a.costINR;
                else actPrem += a.costINR;
            });
        });

        const totalFood = b.foodLocalINR + b.foodPremiumINR;
        const totalTrans = b.transportLocalINR + b.transportPremiumINR;
        const totalAct = actLocal + actPrem;
        const grandTotal = b.stayTotalINR + totalFood + totalTrans + totalAct;

        document.getElementById('budget-container').innerHTML = `
            <div class="budget-card" style="background: rgba(217, 119, 87, 0.05); border-color: rgba(217, 119, 87, 0.2);">
                <div class="budget-title">Total Projected Spend</div>
                <div class="budget-value" style="color: var(--accent)">₹${grandTotal.toLocaleString()}</div>
                <div style="font-size: 0.9rem; color: var(--text-secondary);">Includes ₹${b.stayTotalINR.toLocaleString()} Accommodation</div>
            </div>
            ${renderChartCard("Dining & Cuisine", b.foodLocalINR, b.foodPremiumINR)}
            ${renderChartCard("Experiences", actLocal, actPrem)}
        `;
    }

    function renderChartCard(title, local, premium) {
        const total = local + premium;
        const localPct = total > 0 ? (local / total) * 100 : 50;
        const premPct = total > 0 ? (premium / total) * 100 : 50;
        
        return `
            <div class="budget-card">
                <div class="budget-title">${title}</div>
                <div class="budget-value">₹${total.toLocaleString()}</div>
                
                <div class="bar-chart-container">
                    <div class="chart-bar">
                        <div class="chart-segment-local" style="width: ${localPct}%"></div>
                        <div class="chart-segment-tourist" style="width: ${premPct}%"></div>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item"><div class="dot" style="background: var(--local-green)"></div> Local (₹${local.toLocaleString()})</div>
                        <div class="legend-item"><div class="dot" style="background: var(--tourist-orange)"></div> Tourist (₹${premium.toLocaleString()})</div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderItinerary() {
        const container = document.getElementById('itinerary-container');
        container.innerHTML = currentPlan.itinerary.map((day, dayIndex) => {
            const combinedHours = day.activities.reduce((sum, a) => sum + (a.durationHours || 0) + ((a.travelTimeMins || 0)/60), 0);
            const isOverPacked = combinedHours > 8;

            let warningHtml = '';
            if (isOverPacked) {
                const lowPri = day.activities.find(a => a.priority === 'Low');
                warningHtml = `
                    <div class="warning-badge">
                        <span>Pace Check: Active time exceeds 8h (${combinedHours.toFixed(1)}h).</span>
                        ${lowPri ? `<button class="breathe-btn" onclick="skipActivity(${dayIndex}, '${lowPri.id}')">Skip '${esc(lowPri.title)}'</button>` : ''}
                    </div>
                `;
            }

            const activitiesHtml = day.activities.map(act => `
                <div class="activity-card" id="${act.id}" onclick="toggleWiki('${esc(act.title)}', this)">
                    <div class="act-header">
                        <div>
                            <div class="act-time">${esc(act.timeOfDay)}</div>
                            <div class="act-title">${esc(act.title)}</div>
                        </div>
                        <div class="act-cost">₹${act.costINR.toLocaleString()}</div>
                    </div>
                    <div class="act-meta">
                        <span class="pill">⏱️ ${act.durationHours}H Duration</span>
                        <span class="pill transit">🚕 ${act.travelTimeMins}M Transit</span>
                        <span style="color: ${act.costCategory === 'Local' ? 'var(--local-green)' : 'var(--tourist-orange)'}">${esc(act.costCategory)} Experience</span>
                    </div>
                    <div class="wiki-drawer" id="wiki-${act.id}">
                        <!-- Wiki content loads here -->
                    </div>
                </div>
            `).join('');

            return `
                <div class="day-group">
                    <div class="day-indicator"></div>
                    <h3>Day 0${day.day}</h3>
                    <h2>${esc(day.theme)}</h2>
                    ${warningHtml}
                    <div style="margin-top: 2rem;">${activitiesHtml}</div>
                </div>
            `;
        }).join('');
    }

    window.skipActivity = function(dayIndex, activityId) {
        event.stopPropagation(); // Prevent wiki expand on skip
        const day = currentPlan.itinerary[dayIndex];
        const card = document.getElementById(activityId);
        
        // Trigger CSS collapse animation
        if(card) {
            // Set explicit height before collapsing for smooth transition
            card.style.height = card.scrollHeight + 'px';
            // Force reflow
            card.offsetHeight; 
            card.classList.add('collapsing');
        }
        
        setTimeout(() => {
            day.activities = day.activities.filter(a => a.id !== activityId);
            renderPlan();
        }, 400); // Matches CSS transition duration
    };

    window.toggleWiki = async function(title, cardElement) {
        const drawer = cardElement.querySelector('.wiki-drawer');
        
        // If already open, close it
        if (drawer.classList.contains('open')) {
            drawer.classList.remove('open');
            return;
        }

        // Close any other open drawers in the itinerary
        document.querySelectorAll('.wiki-drawer.open').forEach(d => {
            if(d !== drawer) d.classList.remove('open');
        });

        // If content is already loaded, just open it
        if (drawer.innerHTML.trim() !== '<!-- Wiki content loads here -->') {
            drawer.classList.add('open');
            return;
        }

        drawer.innerHTML = `<div class="wiki-text" style="padding: 1rem;">Scanning global databases...</div>`;
        drawer.classList.add('open');

        try {
            // Clean up title for better search (remove generic words like "Visit", "Tour")
            let searchTitle = title.replace(/Visit |Tour|Experience|Morning at |Afternoon at /ig, '').split(',')[0].trim();
            const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchTitle)}`);
            
            if (res.status === 404) {
                drawer.innerHTML = `<div class="wiki-text" style="padding: 1rem;">No specific historical records found for this location.</div>`;
                return;
            }

            const data = await res.json();
            
            let imgHtml = '';
            if (data.thumbnail && data.thumbnail.source) {
                imgHtml = `<img src="${data.thumbnail.source}" class="wiki-img" alt="${esc(data.title)}">`;
            }

            drawer.innerHTML = `
                ${imgHtml}
                <div>
                    <div class="wiki-text">${esc(data.extract)}</div>
                    <a href="${data.content_urls.desktop.page}" target="_blank" class="wiki-link">View Full Intel →</a>
                </div>
            `;
        } catch (e) {
            drawer.innerHTML = `<div class="wiki-text" style="padding: 1rem;">Database connection interrupted.</div>`;
        }
    };
</script>
</body>
</html>
